# Base local permanente para desarrollo y demostraciones.
# Se guarda en ProyectoTiendaDrop/data y sobrevive a los reinicios.
spring.datasource.url=jdbc:h2:file:./data/dropstore-local;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
dropstore.cors.allowed-origin=http://localhost:5173
