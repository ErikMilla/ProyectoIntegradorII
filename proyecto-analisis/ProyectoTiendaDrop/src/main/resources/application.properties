spring.application.name=DropStore

# ---------------------------------------------------------------------------
# Base de datos MySQL
# ---------------------------------------------------------------------------
# Todos los valores se pueden sobrescribir con variables de entorno, para que
# cada integrante del equipo use sus propias credenciales sin tocar este
# archivo (ver README.md en la raiz del repositorio).
#
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
#
# createDatabaseIfNotExist=true hace que el esquema se cree solo la primera vez,
# asi nadie necesita entrar a MySQL a crear la base a mano.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bd_tiendadrop}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea y actualiza las tablas a partir de las entidades Java.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Logs de SQL: desactivados para que la consola sea legible.
# Para depurar una consulta puntual: mvn spring-boot:run -DSQL_LOG=true
spring.jpa.show-sql=${SQL_LOG:false}
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8081}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Origen permitido para el frontend (Vite). Lo lee CorsConfig.
dropstore.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# ---------------------------------------------------------------------------
# Carga de imagenes de producto
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# Datos de ejemplo
# ---------------------------------------------------------------------------
# Con true, al arrancar se cargan marcas, categorias, productos y usuarios de
# demostracion SOLO si la base esta vacia. Nunca pisa datos existentes.
# La carga esta desactivada por defecto. Para habilitarla se requieren ambas
# variables: DROPSTORE_SEED=true y una DROPSTORE_DEMO_PASSWORD segura.
dropstore.seed.enabled=${DROPSTORE_SEED:false}
dropstore.seed.demo-password=${DROPSTORE_DEMO_PASSWORD:}
dropstore.seed.admin-email=${DROPSTORE_ADMIN_EMAIL:admin@dropstore.local}

# Estado de servicio para monitoreo y despliegues con reinicio seguro.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# MFA por correo
# ---------------------------------------------------------------------------
# En producción configura SMTP_* y MFA_MAIL_ENABLED=true. El código de
# desarrollo debe permanecer apagado fuera del equipo local.
dropstore.mfa.mail-enabled=${MFA_MAIL_ENABLED:false}
dropstore.mfa.dev-code-enabled=${MFA_DEV_CODE_ENABLED:false}
dropstore.mfa.code-ttl=PT5M
dropstore.mfa.max-attempts=5
dropstore.mfa.resend-cooldown=PT60S
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
# Evita marcar el servidor local como caído cuando el correo real está apagado.
management.health.mail.enabled=${MFA_MAIL_ENABLED:false}
